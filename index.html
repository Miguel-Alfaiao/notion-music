<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music</title><style>html,body{margin:0;background:transparent;color:#787774;display:grid;place-items:center;min-height:100vh}button{background:transparent;border:0;color:inherit;cursor:pointer;padding:8px;border-radius:8px}button:hover{background:#8882}button:focus-visible{outline:2px solid currentColor}svg{width:24px;height:24px;display:block}</style><button id="toggle" aria-label="Reproduzir música" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><g id="waves"><path d="M15 9a4 4 0 0 1 0 6M18 5a9 9 0 0 1 0 14"/></g><g id="pause" style="display:none"><path d="M16 8v8M20 8v8"/></g></svg></button><audio id="music" src="music.mp3" preload="none"></audio><script>const a=document.getElementById('music'),b=document.getElementById('toggle');function update(){const p=!a.paused;b.setAttribute('aria-pressed',String(p));b.setAttribute('aria-label',p?'Pausar música':'Reproduzir música');document.getElementById('waves').style.display=p?'none':'';document.getElementById('pause').style.display=p?'':'none'}b.onclick=async()=>{if(a.paused){try{await a.play()}catch(e){alert('Não foi possível reproduzir o áudio.')}}else a.pause()};for(const e of ['play','pause','ended'])a.addEventListener(e,update);</script></html>
